# Monthly Transparency in Coverage scan on GitHub's free public-repository runners.
#
# The configuration (payer list, organization identifiers, roster) is committed
# only as config/config.tar.age, and every result leaves the runner encrypted
# to scanner.pub. Logs print counts and statuses, never names or amounts.
#
# plan    discovers each payer's newest files once and size-balances shards
# shard   streams one shard's files (4 workers on the 4-core runner)
# combine merges shards, decides each payer's freshness verdict, and attaches
#         the encrypted result to a release (runs on main only; a run from
#         another branch keeps it as a 3-day artifact); the run fails if any
#         payer is missing an expected file, is stale, or had a file not read
#         completely
name: Scan

on:
  schedule:
    - cron: '17 9 13 * *'   # 13th: most payers have posted the month's files
    - cron: '17 9 17 * *'   # 17th: retry only if this month has no successful scan
  workflow_dispatch:
    inputs:
      payers:
        description: Comma-separated payer ids (blank = all)
        required: false
        default: ''
      as_of:
        description: As-of date YYYY-MM-DD for expiration and freshness (blank = today)
        required: false
        default: ''
      combine_run_id:
        description: Re-run only the merge, from this earlier run's shard artifacts (kept 3 days)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  MRF_QUIET_LOG: '1'

jobs:
  plan:
    if: inputs.combine_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      skip: ${{ steps.retry.outputs.skip }}
    steps:
      - name: Keep a manual run's payer selection out of the log
        # The payer list is private configuration. Read the selection from the event file (no
        # expression, so nothing is printed) and mask it before a step's env block would show it.
        run: |
          selection=$(jq -r '.inputs.payers // ""' "$GITHUB_EVENT_PATH")
          for id in "$selection" $(printf '%s' "$selection" | tr ',' ' '); do
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -q -r mrf_pipeline/requirements.txt
          sudo apt-get install -y -qq age >/dev/null
      - name: Self-test (synthetic data)
        run: python -m unittest discover -s tests -q
      - name: Decrypt configuration
        env:
          SCANNER_AGE_KEY: ${{ secrets.SCANNER_AGE_KEY }}
        run: bash scripts/decrypt-config.sh
      - name: Skip the retry when this month already succeeded
        id: retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%d)" = 17 ]; then
            month=$(date -u +%Y-%m)
            done=$(gh api "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?status=success&created=>=${month}-01" --jq '.total_count')
            [ "${done:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: Discover files and plan shards
        id: plan
        if: steps.retry.outputs.skip != 'true'
        env:
          PAYERS: ${{ inputs.payers }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          python -m mrf_pipeline plan --out "$RUNNER_TEMP/plan.json" --shards 16 --github-matrix \
            ${PAYERS:+--payers "$PAYERS"} ${AS_OF:+--as-of "$AS_OF"}
          age -R scanner.pub -o plan.json.age "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@v7
        if: steps.retry.outputs.skip != 'true'
        with:
          name: plan
          path: plan.json.age
          retention-days: 7

  shard:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -q -r mrf_pipeline/requirements.txt
          sudo apt-get install -y -qq age >/dev/null
      - name: Decrypt configuration and plan
        env:
          SCANNER_AGE_KEY: ${{ secrets.SCANNER_AGE_KEY }}
        run: bash scripts/decrypt-config.sh
      - uses: actions/download-artifact@v8
        with:
          name: plan
      - name: Stream shard ${{ matrix.shard }}
        run: |
          age -d -i "$RUNNER_TEMP/scanner.key" -o "$RUNNER_TEMP/plan.json" plan.json.age
          python -m mrf_pipeline run --plan "$RUNNER_TEMP/plan.json" --shard ${{ matrix.shard }} --workers 4 \
            --scratch "$RUNNER_TEMP" --out "$RUNNER_TEMP/shard"
      - name: Encrypt shard output
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/shard" ]; then
            tar -C "$RUNNER_TEMP" -czf - shard | age -R scanner.pub -o shard-${{ matrix.shard }}.tar.gz.age
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.tar.gz.age
          retention-days: 3
          if-no-files-found: ignore

  combine:
    needs: [plan, shard]
    if: always() && ((needs.plan.result == 'success' && needs.plan.outputs.skip != 'true') || inputs.combine_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      MRF_ALERT_WEBHOOK: ${{ secrets.MRF_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -q -r mrf_pipeline/requirements.txt
          sudo apt-get install -y -qq age >/dev/null
      - name: Decrypt configuration
        env:
          SCANNER_AGE_KEY: ${{ secrets.SCANNER_AGE_KEY }}
        run: bash scripts/decrypt-config.sh
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          run-id: ${{ inputs.combine_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Merge shards and decide payer freshness
        id: combine
        run: |
          set +e
          work="$RUNNER_TEMP/work"; mkdir -p "$work/shards"
          age -d -i "$RUNNER_TEMP/scanner.key" -o "$work/plan.json" artifacts/plan/plan.json.age
          for f in artifacts/shard-*/shard-*.tar.gz.age; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .tar.gz.age); mkdir -p "$work/shards/$n"
            age -d -i "$RUNNER_TEMP/scanner.key" "$f" | tar -xzf - -C "$work/shards/$n" --strip-components=1
          done
          python -m mrf_pipeline combine --plan "$work/plan.json" "$work"/shards/shard-* --out "$work/final"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          python -m mrf_pipeline check-references "$work/final"
          echo "references=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Encrypt the result
        id: encrypt
        if: always() && steps.combine.outcome == 'success'
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tar -C "$RUNNER_TEMP/work" -czf - final | age -R scanner.pub -o "scan-${stamp}.tar.gz.age"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Attach the encrypted result to a release
        id: release
        # Only main publishes. The importer accepts only releases attached by scan.yml on main,
        # so a run from another branch must neither become the newest release nor move main.
        if: always() && steps.encrypt.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.combine.outputs.status }}
          STAMP: ${{ steps.encrypt.outputs.stamp }}
        run: |
          tag="scan-${STAMP}-${{ github.run_id }}"
          verdict=$([ "$STATUS" = 0 ] && echo complete || echo "incomplete (at least one payer failed its checks)")
          gh release create "$tag" "scan-${STAMP}.tar.gz.age" --title "Scan ${STAMP}" \
            --notes "Encrypted scan output from run ${{ github.run_id }} (shards from run ${{ inputs.combine_run_id || github.run_id }}): ${verdict}."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Keep a branch run's encrypted result as an artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.encrypt.outcome == 'success' && github.ref != 'refs/heads/main'
        with:
          name: scan-result
          path: scan-${{ steps.encrypt.outputs.stamp }}.tar.gz.age
          retention-days: 3
      - name: Record the scan date
        if: always() && steps.release.outcome == 'success'
        env:
          STATUS: ${{ steps.combine.outputs.status }}
        run: |
          # A small commit each month also keeps the schedule active (GitHub pauses
          # scheduled workflows in public repositories after 60 days without activity).
          # It goes on top of the current main, which may have moved during the multi-hour scan.
          git fetch -q --depth=1 origin main
          git checkout -q --detach FETCH_HEAD
          printf '{"scanned_at": "%s", "run_id": "%s", "release": "%s", "complete": %s}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.run_id }}" "${{ steps.release.outputs.tag }}" \
            "$([ "$STATUS" = 0 ] && echo true || echo false)" > last-scan.json
          git config user.name "scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-scan.json
          git commit -q -m "Record scan ${{ github.run_id }}"
          git push -q origin HEAD:main
      - name: Fail loudly on stale, missing or unread payer files
        if: steps.combine.outputs.status != '0'
        run: |
          echo "::error::One or more payers failed freshness or completeness checks; the encrypted run.json says which"
          exit 1
      - name: Alert webhook
        if: failure() && env.MRF_ALERT_WEBHOOK != ''
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Scan failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$MRF_ALERT_WEBHOOK"
